<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Student OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #f5f7fb;
            --bg-2: #e9edf7;
            --ink: #14213d;
            --muted: #5b6787;
            --line: #dfe5f1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: "Space Grotesk", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 20% 14%, #ffffff 0%, rgba(255,255,255,0) 34%),
                radial-gradient(circle at 82% 2%, #ecf2ff 0%, rgba(236,242,255,0) 30%),
                linear-gradient(120deg, var(--bg-1), var(--bg-2));
        }
        .panel {
            width: min(520px, 100%);
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255,255,255,.92);
            box-shadow: 0 16px 34px rgba(15,23,42,.1);
            padding: 20px;
            backdrop-filter: blur(6px);
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 30px;
            line-height: 1.08;
            color: #11315f;
            letter-spacing: -0.02em;
        }
        .sub {
            margin: 0 0 14px 0;
            color: var(--muted);
            font-size: 14px;
        }
        .meta {
            border: 1px solid #cfd9ea;
            border-radius: 12px;
            background: #f8fbff;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #314158;
        }
        .meta strong {
            color: #0f2f59;
        }
        label {
            display: block;
            font-size: 13px;
            color: #3d4f71;
            margin: 10px 0 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            height: 42px;
            border-radius: 10px;
            border: 1px solid #cfd8eb;
            padding: 0 12px;
            font: inherit;
            color: #102244;
            background: #fff;
        }
        input:focus {
            outline: none;
            border-color: #2d6cdf;
            box-shadow: 0 0 0 3px rgba(45,108,223,.15);
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        button {
            border: none;
            border-radius: 10px;
            height: 42px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            background: #edf3ff;
            color: #1d4f99;
            border: 1px solid #bfd6fb;
        }
        .btn-primary {
            background: linear-gradient(90deg, #2d6cdf, #4d83f6);
            color: #fff;
        }
        .notice {
            margin-top: 12px;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            display: none;
        }
        .notice.show { display: block; }
        .notice.ok {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .notice.err {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .back {
            margin-top: 12px;
            display: inline-block;
            color: #2d6cdf;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Verify Student Access</h1>
        <p class="sub">First-time login verification is required for student accounts.</p>
        <div class="meta">Email: <strong>{{ email }}</strong></div>

        {% if error %}
        <div class="notice err show">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="notice ok show">{{ message }}</div>
        {% endif %}
        <div id="uiMsg" class="notice"></div>

        <label for="otp">OTP Code</label>
        <input id="otp" type="text" inputmode="numeric" pattern="[0-9]{4,8}" placeholder="Enter OTP">

        <div class="actions">
            <button id="sendBtn" type="button" class="btn-secondary">Send OTP</button>
            <button id="verifyBtn" type="button" class="btn-primary">Verify & Login</button>
        </div>

        <a class="back" href="/login">Back to login</a>
    </div>

    <script>
        const uiMsg = document.getElementById("uiMsg");
        const otpEl = document.getElementById("otp");
        const sendBtn = document.getElementById("sendBtn");
        const verifyBtn = document.getElementById("verifyBtn");

        function show(kind, text) {
            uiMsg.className = `notice ${kind === "ok" ? "ok" : "err"} show`;
            uiMsg.textContent = text || "";
        }

        sendBtn.onclick = async () => {
            const res = await fetch("/auth/student/send-first-otp", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: ""
            });
            const data = await res.json();
            if (!res.ok || !data.ok) {
                show("err", data.error || "Unable to send OTP.");
                return;
            }
            show("ok", data.message || "OTP sent.");
        };

        verifyBtn.onclick = async () => {
            const otp = otpEl.value.trim();
            if (!otp) {
                show("err", "Enter OTP.");
                return;
            }
            const payload = new URLSearchParams({ otp });
            const res = await fetch("/auth/student/verify-first-otp", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: payload.toString()
            });
            const data = await res.json();
            if (!res.ok || !data.ok) {
                show("err", data.error || "OTP verification failed.");
                return;
            }
            window.location.href = data.redirect || "/student/dashboard";
        };
    </script>
</body>
</html>
